spring.application.name=cartonloading_be

# Independent Carton Loading MongoDB database.
# Override these values through environment variables when running in Docker.
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:cartonloading}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-part-count=30

spring.main.allow-circular-references=true

server.address=0.0.0.0
server.port=${SERVER_PORT:8083}

server.ssl.enabled=false
# server.ssl.key-store=file:D:/Project internal/chung chi/homepage.p12
# server.ssl.key-store-password=123456
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=homepage

server.forward-headers-strategy=framework

# Dangerous TEST-ONLY endpoint. Keep disabled in real environments.
# Enable only against a disposable test database: LULULEMON_TEST_CLEANUP_ENABLED=true
lululemon.test-cleanup.enabled=${LULULEMON_TEST_CLEANUP_ENABLED:false}

# RF88 PDA over wired USB/ADB: override with RFID_ADB_PATH if different.
lululemon.rfid.adb-path=${RFID_ADB_PATH:D:/Project Carton/LULULEMON/platform-tools/adb.exe}

# JWT: use JWT_SECRET if supplied (production / shared backend instances).
# Otherwise, for local/dev runs generate ONE random secret on first startup and
# persist it outside the source tree. It is reused after restart.
# Production profiles (prod / production) do not auto-generate missing secrets.
security.jwt.secret=${JWT_SECRET:}
security.jwt.secret-file=${JWT_SECRET_FILE:${user.home}/.cartonloading/jwt-secret.key}
security.jwt.auto-generate=${JWT_SECRET_AUTO_GENERATE:true}
